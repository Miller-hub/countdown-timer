<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒數計日器｜考試、節日、自訂</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>倒數計日器</h1>
    <nav class="tabs">
      <button id="tab-exam" onclick="showTab('exam')">考試倒數</button>
      <button id="tab-holiday" onclick="showTab('holiday')">節日倒數</button>
      <button id="tab-custom" onclick="showTab('custom')">自訂倒數</button>
    </nav>
  </header>

  <main>
    <section id="exam" class="tab active">
      <div class="today-line"><span id="todayInfo-exam"></span></div>
      <h2>考試倒數</h2>
      <p class="hint">👉 點一下項目可設為主考試</p>
      <ul id="examList"></ul>
      <p id="examHint" class="selected-hint"></p>
    </section>

    <section id="holiday" class="tab">
      <div class="today-line"><span id="todayInfo-holiday"></span></div>
      <h2>節日倒數</h2>
      <p class="hint">👉 點一下項目可設為主節日</p>
      <ul id="holidayList"></ul>
      <p id="holidayHint" class="selected-hint"></p>
    </section>

    <section id="custom" class="tab">
      <div class="today-line"><span id="todayInfo-custom"></span></div>
      <h2>自訂倒數</h2>
      <input type="date" id="customDate" />
      <button onclick="calculateCustom()">開始倒數</button>
      <p id="customResult"></p>
    </section>

    
    <p class="pwa-hint" id="pwaPrompt"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
